[project]
name = "football-analytics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jamie Rowe", email = "jpkrowe@hotmail.co.uk" }
]
requires-python = ">=3.11"
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "penaltyblog>=1.13.1",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "statsmodels>=0.15.0",
]

[project.scripts]
football-analytics = "football_analytics:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
